[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lpdev"
version = "0.1.0"
description = "Self-hosted GitLab merge request auto-review service"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "jinja2",
    "pyyaml",
    "pydantic>=2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"lpdev.web" = ["templates/*.html", "static/*.svg", "static/*.js"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "pytest-cov", "ruff"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.coverage.run]
source = ["lpdev"]
branch = true

[tool.coverage.report]
fail_under = 88
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 160

[tool.ruff.lint]
select = ["E", "F"]
