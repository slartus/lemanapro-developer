# Пример конфига lemanapro-developer.
# Путь задаёт LPDEV_CONFIG (launchd: <проект>/config.yaml), без него — ~/.config/lemanapro-developer/config.yaml.
# chmod 600: при group/other-writable сервис не стартует, при world-readable — warning.
# Секретов здесь нет: GitLab PAT читается через pat_command (macOS Keychain).
# Неизвестные ключи — ошибка валидации.

gitlab:
  # Базовый URL self-hosted GitLab: только https://, без логина/пароля, query и fragment.
  # Trailing slash не обязателен, срезается.
  url: https://gitlab.example.com
  # Интервал опроса GitLab, секунды.
  poll_interval_sec: 60
  # Shell-команда, печатающая PAT в stdout (без перевода строки — ок).
  # Пример сохранения в Keychain (scope: read_api + read_repository):
  #   security add-generic-password -s mr-watch -a gitlab -w <token>
  pat_command: security find-generic-password -s mr-watch -a gitlab -w

projects:
  - # Числовой ID проекта в GitLab (Project ID на странице проекта).
    gitlab_project_id: 42
    # path_with_namespace (group/project), для отображения и логов.
    slug: group/project
    # Имя глобального read-only агента opencode (~/.config/opencode/agent/<имя>.md).
    # В frontmatter должны быть запрещены edit, bash, webfetch, иначе ревью не запустится.
    agent: mr-watch-reviewer
    # Перезапускать ревью при смене head_sha (push в MR).
    re_review_on_push: false
    # Необязательно: модель/вариант только для этого проекта (переопределяют opencode.*).
    # model: provider/model
    # variant: low

review:
  # Параллельных воркеров ревью (смена применяется после рестарта).
  max_parallel: 2
  # Таймаут opencode run на одно ревью (включая автоповтор при reason=length), секунды.
  timeout_sec: 1800
  # Таймаут opencode run на один вопрос ревьюеру, секунды.
  question_timeout_sec: 600
  # Глубина shallow-клона.
  clone_depth: 50
  # Удалять рабочие каталоги старше N дней (страховка на случай краха).
  workspace_ttl_days: 3
  # Удалять логи ревью (logs/review-*.log) старше N дней при старте.
  log_ttl_days: 14
  # Отсрочка старта ревью после push (trigger push), секунды: каждый новый push
  # в MR отодвигает старт ещё раз. 0 - без отсрочки.
  push_debounce_sec: 120

opencode:
  # Путь до бинаря opencode.
  bin: ~/.opencode/bin/opencode
  # Модель в формате provider/model (по умолчанию - из opencode.json).
  # model: provider/model
  # Вариант модели (уровень reasoning: low, high, max ...).
  # variant: medium
  # Вариант для автоповтора, если модель упёрлась в лимит вывода (reason=length)
  # и не выдала текста. null отключает повтор.
  length_retry_variant: low

radar:
  enabled: true
  # Интервал обновления радара, минуты (1–120). Пока в моих MR идёт CI — раз в минуту, не дольше часа подряд.
  interval_minutes: 5
  fast_refresh_while_ci: true
  # all — все проекты с правами Maintainer+; selected — только selected_project_ids
  # (для «Ждут моего апрува», «Возможные MR», «Сломан default branch»).
  project_filter_mode: all
  selected_project_ids: []
  # Проверки CI, падение которых не считается упавшим CI.
  ignored_check_names: []
  # Не показывать в «Ждут моего апрува» MR, у которых апрувов уже не меньше порога (0 — выкл).
  approval_threshold: 0
  # reviewing, assigned, mentioned, awaitingApproval, threads, authored, possibleMrs, brokenBranches
  hidden_sections: []
  node_bin: node
  timeout_sec: 300

paths:
  # Файл базы SQLite (каталог создаётся автоматически).
  db: ~/projects/lemanapro-developer/data/lpdev.db
  # Рабочие каталоги клонов.
  workspaces: ~/projects/lemanapro-developer/workspaces
  # app.log и review-<id>.log.
  logs: ~/projects/lemanapro-developer/logs
