<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>{% block title %}lemanapro-developer{% endblock %}</title>
<script>
try { if (localStorage.getItem("lpdev.sidebar") === "collapsed") document.documentElement.dataset.sidebar = "collapsed"; } catch (e) {}
</script>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f5f7; --surface: #ffffff; --surface-2: #f0f2f5; --border: #dfe3e8;
    --text: #1b1f24; --muted: #6a727d; --link: #0b63c5; --accent: #1a7f37; --accent-text: #ffffff;
    --ok-bg: #d9f2e0; --ok-fg: #17572b;
    --err-bg: #fbdcdf; --err-fg: #8f1d29;
    --warn-bg: #fff1c2; --warn-fg: #6b4f00;
    --info-bg: #dbe9fb; --info-fg: #164a8a;
    --neutral-bg: #e5e8ec; --neutral-fg: #3d444d;
    --major-bg: #ffe2cc; --major-fg: #8a4208;
    --stale-warn: #8a6100; --stale-bad: #b3261e;
    --radius: 8px;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --surface: #1c1f26; --surface-2: #242831; --border: #2e333d;
      --text: #dde1e7; --muted: #8b929e; --link: #6cb2ff; --accent: #2ea043; --accent-text: #ffffff;
      --ok-bg: #173425; --ok-fg: #9be3b2;
      --err-bg: #3b1d21; --err-fg: #f4a0a8;
      --warn-bg: #3a3016; --warn-fg: #e8c96a;
      --info-bg: #17304f; --info-fg: #8fc0f5;
      --neutral-bg: #2b2e33; --neutral-fg: #b4bac2;
      --major-bg: #3d2817; --major-fg: #f0b077;
      --stale-warn: #e8c96a; --stale-bad: #ff8a94;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  h1 { font-size: 1.35rem; margin: 0 0 1rem; line-height: 1.3; overflow-wrap: anywhere; }
  h2 { font-size: 1.05rem; margin: 1.5rem 0 0.6rem; }
  .muted { color: var(--muted); }
  time.stale-warn { color: var(--stale-warn); font-weight: 600; }
  time.stale-bad { color: var(--stale-bad); font-weight: 600; }
  .small { font-size: 0.85rem; }
  .sidebar { position: fixed; inset: 0 auto 0 0; width: var(--sidebar-w); background: var(--surface); border-right: 1px solid var(--border);
             display: flex; flex-direction: column; z-index: 20; transition: width 0.15s ease, transform 0.2s ease; overflow: hidden; }
  .brand { display: flex; align-items: center; gap: 0.6rem; height: 52px; padding: 0 0.95rem; font-weight: 700; color: var(--text);
           letter-spacing: 0.01em; white-space: nowrap; border-bottom: 1px solid var(--border); }
  .brand:hover { text-decoration: none; }
  .brand-mark { flex: none; width: 26px; height: 26px; border-radius: 7px; background: var(--accent); color: var(--accent-text);
                display: grid; place-items: center; font-size: 0.78rem; }
  .nav { display: flex; flex-direction: column; gap: 0.15rem; padding: 0.6rem 0.5rem; flex: 1; }
  .nav a { display: flex; align-items: center; gap: 0.7rem; color: var(--muted); padding: 0.5rem 0.55rem; border-radius: 6px; white-space: nowrap; }
  .nav a:hover { background: var(--surface-2); text-decoration: none; color: var(--text); }
  .nav a.active { color: var(--text); background: var(--surface-2); font-weight: 600; }
  .nav svg { flex: none; width: 20px; height: 20px; }
  .nav-count { margin-left: auto; min-width: 1.5em; padding: 0 0.4em; border-radius: 999px; background: var(--info-bg); color: var(--info-fg);
               font-size: 0.75rem; font-weight: 700; text-align: center; }
  .nav-count:empty { display: none; }
  .sidebar-foot { border-top: 1px solid var(--border); padding: 0.5rem; display: flex; flex-direction: column; gap: 0.35rem; }
  .health { display: flex; align-items: center; gap: 0.6rem; padding: 0.35rem 0.55rem; font-size: 0.8rem; color: var(--muted); white-space: nowrap; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--neutral-fg); flex: none; margin: 0 5.5px; }
  .dot.ok { background: #2ea043; }
  .dot.degraded { background: #d29922; }
  .dot.down { background: #d1242f; }
  .dot.busy { background: #2f81f7; animation: dot-pulse 1s ease-in-out infinite; }
  @keyframes dot-pulse { 50% { opacity: .25; } }
  .collapse-btn { display: flex; align-items: center; gap: 0.7rem; background: none; border: 0; color: var(--muted); padding: 0.45rem 0.55rem;
                  border-radius: 6px; white-space: nowrap; text-align: left; }
  .collapse-btn:hover:not(:disabled) { background: var(--surface-2); color: var(--text); }
  .collapse-btn svg { flex: none; width: 20px; height: 20px; transition: transform 0.15s ease; }
  :root { --sidebar-w: 220px; }
  @media (width > 760px) {
    :root[data-sidebar="collapsed"] { --sidebar-w: 60px; }
    :root[data-sidebar="collapsed"] .nav-label, :root[data-sidebar="collapsed"] .nav-count { display: none; }
    :root[data-sidebar="collapsed"] .collapse-btn svg { transform: rotate(180deg); }
    :root[data-sidebar="collapsed"] .nav a, :root[data-sidebar="collapsed"] .collapse-btn { justify-content: center; }
    :root[data-sidebar="collapsed"] .brand { padding: 0 1rem; }
  }
  .shell { margin-left: var(--sidebar-w); transition: margin-left 0.15s ease; }
  .mobilebar { display: none; }
  .backdrop { display: none; }
  main { max-width: 1200px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; }
  .table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 0.6rem 0.85rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
  th { background: var(--surface-2); color: var(--muted); font-weight: 600; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; }
  tbody tr:last-child td { border-bottom: 0; }
  button, .btn { font: inherit; padding: 0.42rem 0.95rem; cursor: pointer; border-radius: 6px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled { opacity: 0.55; cursor: progress; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  button.danger { color: var(--err-fg); }
  input, select, textarea { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 0.4rem 0.6rem; }
  textarea { resize: vertical; }
  input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--link); outline-offset: 1px; }
  input.invalid { border-color: #d1242f; }
  .badge { display: inline-block; padding: 0.1rem 0.6rem; border-radius: 999px; font-size: 0.8rem; font-weight: 600; white-space: nowrap; }
  .status.done { background: var(--ok-bg); color: var(--ok-fg); }
  .status.error { background: var(--err-bg); color: var(--err-fg); }
  .status.queued { background: var(--neutral-bg); color: var(--neutral-fg); }
  .status.cloning { background: var(--info-bg); color: var(--info-fg); }
  .status.reviewing { background: var(--warn-bg); color: var(--warn-fg); }
  .status.cancelled { background: var(--surface-2); color: var(--muted); box-shadow: inset 0 0 0 1px var(--border); }
  .status.cloning::before, .status.reviewing::before { content: ""; display: inline-block; width: 0.5em; height: 0.5em; margin-right: 0.4em; border-radius: 50%; background: currentColor; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.2; } }
  @media (prefers-reduced-motion: reduce) { .status::before { animation: none !important; } }
  .sev { display: inline-block; padding: 0.05rem 0.5rem; margin-right: 0.25rem; border-radius: 6px; font-size: 0.8rem; font-weight: 600; }
  .sev.crit { background: var(--err-bg); color: var(--err-fg); }
  .sev.major { background: var(--major-bg); color: var(--major-fg); }
  .sev.minor { background: var(--warn-bg); color: var(--warn-fg); }
  .sev.nit { background: var(--neutral-bg); color: var(--neutral-fg); }
  .verdict { display: inline-block; padding: 0.05rem 0.5rem; margin-right: 0.25rem; border-radius: 6px; font-size: 0.8rem; font-weight: 600; }
  .verdict.APPROVE { background: var(--ok-bg); color: var(--ok-fg); }
  .verdict.APPROVE_WITH_NITS { background: var(--neutral-bg); color: var(--ok-fg); }
  .verdict.REQUEST_CHANGES { background: var(--err-bg); color: var(--err-fg); }
  .sev.clean { background: var(--ok-bg); color: var(--ok-fg); }
  .flash { padding: 0.65rem 1rem; border-radius: var(--radius); margin-bottom: 1rem; border: 1px solid transparent; }
  .flash.ok { background: var(--ok-bg); color: var(--ok-fg); }
  .flash.warn { background: var(--warn-bg); color: var(--warn-fg); }
  .flash.err { background: var(--err-bg); color: var(--err-fg); }
  @media (max-width: 760px) {
    :root { --sidebar-w: 240px; }
    .sidebar { transform: translateX(-100%); visibility: hidden; transition: transform 0.2s ease, visibility 0s linear 0.2s; }
    :root.sidebar-open .sidebar { transform: none; visibility: visible; transition: transform 0.2s ease; box-shadow: 0 0 24px rgba(0, 0, 0, 0.25); }
    :root.sidebar-open .backdrop { display: block; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.35); z-index: 15; }
    .collapse-btn { display: none; }
    .shell { margin-left: 0; }
    .mobilebar { display: flex; align-items: center; gap: 0.6rem; height: 48px; padding: 0 0.75rem; background: var(--surface);
                 border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; }
    .menu-btn { background: none; border: 0; padding: 0.35rem; display: grid; place-items: center; }
    .menu-btn svg { width: 22px; height: 22px; }
    body { font-size: 14px; }
    th, td { padding: 0.5rem 0.6rem; }
  }
  @media (prefers-reduced-motion: reduce) { .sidebar, .shell, .collapse-btn svg { transition: none; } }
  {% block style %}{% endblock %}
</style>
</head>
<body>
<aside class="sidebar" id="sidebar" aria-label="Навигация">
  <a class="brand" href="{{ '/timesheet' if timesheet_only else '/' }}" title="lemanapro-developer"><span class="brand-mark">LP</span><span class="nav-label">lemanapro-developer</span></a>
  <nav class="nav">
    {% if not timesheet_only %}
    <a href="/" {% if active == "index" %}class="active" aria-current="page"{% endif %} title="Merge requests">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M6 8.5v7M18 15.5V9a3 3 0 0 0-3-3h-4"/><path d="M13 3.5 10.5 6 13 8.5"/></svg>
      <span class="nav-label">Merge requests</span><span class="nav-count" id="nav-count-mr"></span>
    </a>
    {% endif %}
    <a href="/timesheet" {% if active == "timesheet" %}class="active" aria-current="page"{% endif %} title="Таймшит">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <span class="nav-label">Таймшит</span>
    </a>
    {% if not timesheet_only %}
    <a href="/settings" {% if active == "settings" %}class="active" aria-current="page"{% endif %} title="Настройки">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      <span class="nav-label">Настройки</span>
    </a>
    {% endif %}
  </nav>
  <div class="sidebar-foot">
    <div class="health" id="health" title="состояние сервиса"><span class="dot" id="health-dot"></span><span class="nav-label" id="health-text">…</span></div>
    <button type="button" class="collapse-btn" id="collapse-btn" aria-controls="sidebar" aria-pressed="false" title="Свернуть меню">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m11 17-5-5 5-5M18 17l-5-5 5-5"/></svg>
      <span class="nav-label">Свернуть</span>
    </button>
  </div>
</aside>
<div class="backdrop" id="backdrop"></div>
<div class="shell">
<header class="mobilebar">
  <button type="button" class="menu-btn" id="menu-btn" aria-controls="sidebar" aria-expanded="false" title="Меню">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <span class="brand-mark">LP</span><strong>lemanapro-developer</strong>
</header>
<main>
{% block content %}{% endblock %}
</main>
</div>
<script>
const STALE_WARN_MS = 3 * 86400 * 1000;
const STALE_BAD_MS = 7 * 86400 * 1000;
const MRW = {
  staleness(iso, nowMs) {
    const t = Date.parse(iso);
    if (isNaN(t)) return "";
    const age = nowMs - t;
    if (age > STALE_BAD_MS) return "bad";
    if (age > STALE_WARN_MS) return "warn";
    return "";
  },
  relTime(iso) {
    const t = Date.parse(iso);
    if (isNaN(t)) return iso;
    const s = Math.round((Date.now() - t) / 1000);
    if (s < 45) return "только что";
    if (s < 3600) return Math.round(s / 60) + " мин назад";
    if (s < 86400) return Math.round(s / 3600) + " ч назад";
    if (s < 86400 * 30) return Math.round(s / 86400) + " дн назад";
    return new Date(t).toLocaleDateString();
  },
  renderTimes(root) {
    (root || document).querySelectorAll("time[data-ts]").forEach(function (el) {
      el.textContent = MRW.relTime(el.dataset.ts);
      el.title = new Date(el.dataset.ts).toLocaleString();
      el.classList.remove("stale-warn", "stale-bad");
      if (el.dataset.open === "1") {
        const level = MRW.staleness(el.dataset.ts, Date.now());
        if (level) el.classList.add("stale-" + level);
      }
    });
  },
  async health() {
    const dot = document.getElementById("health-dot");
    const text = document.getElementById("health-text");
    let state = "down", label = "нет связи", refreshing = false;
    try {
      const r = await fetch("/healthz", {cache: "no-store"});
      const body = await r.json();
      refreshing = Boolean(body.refreshing);
      if (body.status === "ok") { state = "ok"; label = refreshing ? "обновляется…" : "работает"; }
      else { state = "degraded"; label = "деградация"; }
      if (!refreshing && body.last_poll) label += " · опрос " + MRW.relTime(body.last_poll);
    } catch (e) {}
    dot.className = "dot " + (refreshing ? "busy" : state);
    text.textContent = label;
    document.getElementById("health").title = label;
    if (refreshing) setTimeout(MRW.health, 2000);
  }
};
(function () {
  const root = document.documentElement;
  const collapseBtn = document.getElementById("collapse-btn");
  const menuBtn = document.getElementById("menu-btn");
  const sidebar = document.getElementById("sidebar");
  function syncCollapse() {
    const collapsed = root.dataset.sidebar === "collapsed";
    collapseBtn.setAttribute("aria-pressed", String(collapsed));
    collapseBtn.title = collapsed ? "Развернуть меню" : "Свернуть меню";
  }
  collapseBtn.addEventListener("click", function () {
    const collapsed = root.dataset.sidebar !== "collapsed";
    if (collapsed) root.dataset.sidebar = "collapsed"; else delete root.dataset.sidebar;
    try { localStorage.setItem("lpdev.sidebar", collapsed ? "collapsed" : "expanded"); } catch (e) {}
    syncCollapse();
  });
  const isOpen = function () { return root.classList.contains("sidebar-open"); };
  function setOpen(open) {
    const focusWasInside = sidebar.contains(document.activeElement);
    root.classList.toggle("sidebar-open", open);
    menuBtn.setAttribute("aria-expanded", String(open));
    if (open) sidebar.querySelector(".nav a").focus();
    else if (focusWasInside) menuBtn.focus();
  }
  menuBtn.addEventListener("click", function () { setOpen(!isOpen()); });
  document.getElementById("backdrop").addEventListener("click", function () { setOpen(false); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && isOpen()) setOpen(false); });
  const mobile = window.matchMedia("(max-width: 760px)");
  mobile.addEventListener("change", function (e) { if (!e.matches && isOpen()) setOpen(false); });
  syncCollapse();
})();
MRW.renderTimes();
MRW.health();
setInterval(function () { MRW.renderTimes(); }, 30000);
setInterval(MRW.health, 15000);
</script>
{% block scripts %}{% endblock %}
</body>
</html>
